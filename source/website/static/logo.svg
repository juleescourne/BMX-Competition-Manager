<?xml version="1.0" encoding="UTF-8"?>
<!--
  Logo neutre du projet.

  L'application affichait jusqu'ici le logo d'une fédération sportive réelle,
  redistribué dans un dépôt public. Il a été remplacé par ce visuel générique :
  un portfolio ne doit pas diffuser la marque d'un tiers ni laisser croire à
  une affiliation. Remplace-le par le tien si tu en as l'autorisation.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 84" width="300" height="84"
     role="img" aria-label="BMX Competition Manager">
  <title>BMX Competition Manager</title>
  <g fill="none" stroke="#0d5e63" stroke-width="4">
    <circle cx="26" cy="56" r="15"/>
    <circle cx="72" cy="56" r="15"/>
  </g>
  <path d="M26 56 L44 30 L64 30 M44 30 L58 56 M72 56 L62 34"
        fill="none" stroke="#9c3327" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="44" cy="30" r="4" fill="#9c3327"/>
  <text x="100" y="44" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="27" font-weight="700" fill="#161b1a">BMX</text>
  <text x="100" y="66" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="14" letter-spacing="1.6" fill="#5f6a66">COMPETITION MANAGER</text>
</svg>
